name: Build research paper PDF
on:
  push:
    branches: [main]
    paths:
      - scripts/make_paper.py
      - results/**
      - .github/workflows/build-paper.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependency
        run: python -m pip install 'reportlab>=4,<5'
      - name: Regenerate paper
        run: python scripts/make_paper.py
      - name: Commit regenerated paper
        run: |
          if ! git diff --quiet -- output/pdf/sorting_as_agent_research_v14.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/pdf/sorting_as_agent_research_v14.pdf
            git commit -m "Regenerate paper PDF after source update"
            git push
          fi
